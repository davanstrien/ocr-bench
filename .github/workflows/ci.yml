name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_call: # release.yml runs this suite before it publishes

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: uv.lock holds no settings from a local uv config
        # Parse the lock as TOML: a text match misses an indented or quoted key
        # and fails on a comment.
        run: |
          python3 - <<'EOF'
          import sys
          import tomllib

          with open("uv.lock", "rb") as handle:
              lock = tomllib.load(handle)
          registries = sorted(
              {
                  package["source"]["registry"]
                  for package in lock.get("package", [])
                  if "registry" in package.get("source", {})
              }
          )
          problems = []
          if registries != ["https://pypi.org/simple"]:
              problems.append(f"uv.lock must resolve from https://pypi.org/simple only. Found: {registries}")
          settings = sorted(key for key in lock.get("options", {}) if key.startswith("exclude-newer"))
          if settings:
              problems.append(f"uv.lock records {', '.join(settings)}, probably from a local uv config.")
          if problems:
              print("\n".join([*problems, "Relock with: uv lock --no-config"]))
              sys.exit(1)
          EOF
      - run: uv python install 3.13
      - run: uv sync --locked --dev --extra viewer
      - run: uv run ruff check src/ tests/
      - run: uv run ruff format --check src/ tests/
      - run: uvx rumdl@0.3.2 check .  # Markdown: tables aligned, see .rumdl.toml
      - run: uv run ty check src/
      - run: uv run pytest tests/ -x -q
