name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_call: # release.yml runs this suite before it publishes

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: uv.lock resolves from public PyPI only
        run: |
          set -euo pipefail
          registries="$(grep -oE 'registry = "[^"]+"' uv.lock | sort -u)"
          if [ "$registries" != 'registry = "https://pypi.org/simple"' ]; then
            echo "uv.lock must resolve from https://pypi.org/simple only. Found:"
            echo "$registries"
            echo "Relock with: uv lock --default-index https://pypi.org/simple"
            exit 1
          fi
      - run: uv python install 3.13
      - run: uv sync --locked --dev --extra viewer
      - run: uv run ruff check src/ tests/
      - run: uv run ruff format --check src/ tests/
      - run: uv run ty check src/
      - run: uv run pytest tests/ -x -q
