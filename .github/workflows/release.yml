name: Release
# A release is one merged PR: bump `version` in pyproject.toml and add a dated CHANGELOG section.
# When that reaches main, this workflow runs the CI suite, publishes to PyPI, then tags the
# commit and creates the GitHub release from the CHANGELOG section. A push to main whose version
# already has a GitHub release does nothing. If a run stops part-way, re-run its failed jobs.
on:
  push:
    branches: [main]
    paths: [pyproject.toml]
  workflow_dispatch:

concurrency:
  group: release # one release at a time; never cancel a run that may be publishing
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      release: ${{ steps.version.outputs.release }}
    steps:
      - uses: actions/checkout@v4
      - id: version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(python3 -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')
          echo "version=$version" >> "$GITHUB_OUTPUT"
          # the GitHub release is the last step, so it marks a finished release
          if gh release view "v$version" >/dev/null 2>&1; then
            echo "v$version is already released: nothing to do"
            echo "release=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # fail before the tests if the CHANGELOG section is missing or undated
          if ! grep -qE "^## \[$version\] - [0-9]{4}-[0-9]{2}-[0-9]{2}$" CHANGELOG.md; then
            echo "CHANGELOG.md has no dated '## [$version] - YYYY-MM-DD' section"
            exit 1
          fi
          echo "release=true" >> "$GITHUB_OUTPUT"

  test:
    needs: check
    if: needs.check.outputs.release == 'true'
    uses: ./.github/workflows/ci.yml # publishes only a commit that passes the CI suite

  publish:
    needs: [check, test]
    runs-on: ubuntu-latest
    environment:
      name: pypi
    permissions:
      id-token: write # PyPI trusted publishing (OIDC), no tokens
      contents: write # the tag and the GitHub release
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv python install 3.13
      - run: uv build
      - name: Smoke test wheel
        env:
          VERSION: ${{ needs.check.outputs.version }}
        run: |
          uv run --isolated --no-project --with dist/*.whl python -c "
          import os, ocr_bench
          from ocr_bench.cli import main
          assert ocr_bench.__version__ == os.environ['VERSION'], ocr_bench.__version__
          print('OK', ocr_bench.__version__)"
      # --check-url skips files PyPI already has (uv_build output is byte-identical on a
      # rebuild), so a re-run after a failed release step works
      - run: uv publish --trusted-publishing always --check-url https://pypi.org/simple/
      - name: GitHub release from the CHANGELOG section
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.check.outputs.version }}
        run: |
          awk -v v="$VERSION" '$0 ~ "^## \\[" v "\\]" {found=1; next} /^## \[/ {if (found) exit} found' \
            CHANGELOG.md > notes.md
          gh release create "v$VERSION" --target "$GITHUB_SHA" --title "ocr-bench $VERSION" \
            --notes-file notes.md dist/*
