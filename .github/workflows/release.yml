name: Release
# A release is one merged PR: bump `version` in pyproject.toml and add a dated CHANGELOG section.
# When that reaches main, this workflow runs the CI suite, publishes to PyPI, then tags the
# commit and creates the GitHub release from the CHANGELOG section. A push to main whose version
# already has a published GitHub release does nothing. If a run stops part-way, re-run all its
# jobs (RELEASING.md has the recovery steps).
on:
  push:
    branches: [main]
    paths: [pyproject.toml]
  workflow_dispatch:

concurrency:
  group: release # one release at a time; never cancel a run that may be publishing
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  check:
    if: github.ref == 'refs/heads/main' # a manual run on another branch must not publish it
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      release: ${{ steps.version.outputs.release }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(python3 -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')
          echo "version=$version" >> "$GITHUB_OUTPUT"
          # the GitHub release is the last step, so a published one marks a finished release.
          # `gh release create` makes a draft first, so an interrupted run can leave a draft.
          if draft=$(gh release view "v$version" --json isDraft --jq .isDraft 2>/dev/null); then
            if [ "$draft" = "false" ]; then
              echo "v$version is already released: nothing to do"
              echo "release=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            echo "v$version has an unfinished draft release from an earlier run."
            echo "Delete it (gh release delete v$version --yes), then re-run all jobs."
            exit 1
          fi
          # fail before the tests if the CHANGELOG section is missing or undated
          if ! grep -qE "^## \[$version\] - [0-9]{4}-[0-9]{2}-[0-9]{2}$" CHANGELOG.md; then
            echo "CHANGELOG.md has no dated '## [$version] - YYYY-MM-DD' section"
            exit 1
          fi
          echo "release=true" >> "$GITHUB_OUTPUT"

  test:
    needs: check
    if: needs.check.outputs.release == 'true'
    uses: ./.github/workflows/ci.yml # publishes only a commit that passes the CI suite

  publish:
    needs: [check, test]
    runs-on: ubuntu-latest
    environment:
      name: pypi
    permissions:
      id-token: write # PyPI trusted publishing (OIDC), no tokens
      contents: write # the tag and the GitHub release
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: false # publish job: never build from a shared cache
      - run: uv python install 3.13
      - run: uv build
      - name: Smoke test wheel
        env:
          VERSION: ${{ needs.check.outputs.version }}
        run: |
          uv run --isolated --no-project --with dist/*.whl python -c "
          import os, ocr_bench
          from ocr_bench.cli import main
          assert ocr_bench.__version__ == os.environ['VERSION'], ocr_bench.__version__
          print('OK', ocr_bench.__version__)"
      # --check-url skips files PyPI already has (uv_build output is byte-identical on a
      # rebuild), so a re-run after a failed release step works
      - run: uv publish --trusted-publishing always --check-url https://pypi.org/simple/
      - name: GitHub release from the CHANGELOG section
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.check.outputs.version }}
        run: |
          awk -v v="$VERSION" '$0 ~ "^## \\[" v "\\]" {found=1; next} /^## \[/ {if (found) exit} found' \
            CHANGELOG.md > notes.md
          gh release create "v$VERSION" --target "$GITHUB_SHA" --title "ocr-bench $VERSION" \
            --notes-file notes.md dist/*
